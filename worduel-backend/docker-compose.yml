services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: worduel
      POSTGRES_USER: worduel
      POSTGRES_PASSWORD: change-me-before-production
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worduel -d worduel"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      PORT: "8080"
      ENVIRONMENT: production
      DATABASE_URL: postgres://worduel:change-me-before-production@db:5432/worduel?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
